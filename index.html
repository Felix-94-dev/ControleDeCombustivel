<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14463A">
<title>Frota União – Controle de combustível</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛽%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="pump" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17M3 21h12M6 8h6M14 9h2l2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></symbol></svg>

<section id="login">
 <form class="lcard" data-f="login">
  <svg class="mark" aria-hidden="true"><use href="#pump"/></svg>
  <div><h1>Frota União</h1><p>Controle de combustível</p></div>
  <label>Usuário<input name="usuario" autocomplete="username" autocapitalize="none" required></label>
  <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
  <label class="chk"><input type="checkbox" data-i="mostra"> Mostrar senha</label>
  <p id="lerr" class="badtxt" role="alert" hidden>Usuário ou senha incorretos.</p>
  <button class="go">Entrar</button>
 </form>
</section>

<div class="app">
 <header class="top">
  <div class="brand"><svg aria-hidden="true"><use href="#pump"/></svg>Frota União</div>
  <nav><a href="#painel">Painel</a><a href="#lancamentos">Lançamentos</a><a href="#veiculos">Veículos</a><a href="#motoristas">Motoristas</a><a href="#combustiveis">Combustíveis</a><a href="#fornecedores">Fornecedores</a><a href="#backup">Backup</a></nav>
  <div class="who"><span id="nome"></span><button data-a="sair">Sair</button></div>
 </header>
 <main></main>
 <a class="fab" href="#lancamentos">+ Lançar</a>
</div>
<div id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
